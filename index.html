<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10〜20をつくろう！タイムゲーム</title><style>
:root{--ink:#24304a;--coral:#f05c5c;--green:#4fbc75}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{background:#dff3f7;color:var(--ink);font-family:"UD Digi Kyokasho N-R","BIZ UDPGothic","Yu Gothic",sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}.app{min-height:100dvh;padding:8px;background:radial-gradient(circle at 5% 10%,#fff1aa 0 8%,transparent 8.4%),radial-gradient(circle at 95% 90%,#bdebd2 0 10%,transparent 10.4%),#dff3f7}.card{width:min(1180px,100%);min-height:calc(100dvh - 16px);margin:auto;padding:10px 15px 14px;border:3px solid #fff;border-radius:24px;background:#fffdf7}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.badge{display:grid;width:50px;height:50px;place-items:center;border-radius:15px;background:var(--coral);color:#fff;font-size:2rem;font-weight:900;box-shadow:0 5px 0 #c94444;transform:rotate(-4deg)}.brand small{display:block;color:#627084;font-weight:800;letter-spacing:.1em}.brand h1{margin:-2px 0 0;font-size:clamp(1.35rem,3vw,2.05rem)}.actions{display:flex;gap:7px}.util,.sound{min-height:42px;border:2px solid #aebbc3;border-radius:12px;background:#fff;color:#33425a;font-weight:800}.util{padding:6px 13px}.sound{width:44px}.util:disabled{opacity:.38}.status{display:flex;min-height:38px;margin:7px 0;padding:4px 10px;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);border-radius:11px;background:#edf4f5;font-size:.8rem;font-weight:800}.status b{color:#176e98}.target{display:flex;align-items:center;gap:5px}.target select{min-width:66px;padding:3px 7px;border:2px solid #f09b45;border-radius:9px;background:#fff9d9;color:#b35025;font-size:1.12rem;font-weight:900}.play{display:grid;min-height:calc(100dvh - 139px);grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:13px}.problem,.numbers{position:relative;display:flex;min-width:0;min-height:0;border-radius:21px;flex-direction:column;align-items:center;justify-content:center}.problem{padding:16px 22px;border:3px solid #83cfea;background:linear-gradient(145deg,#f4fcff,#e3f7ff);overflow:hidden}.numbers{padding:12px;border:3px solid #ffd05c;background:#fff8da}.round{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}.count{padding:5px 12px;border-radius:999px;background:#fff;color:#277ea7;font-weight:900}.timer{font-size:clamp(1rem,2.3vw,1.45rem);font-weight:900}.progress{position:absolute;top:53px;left:20px;right:20px;height:7px;border-radius:999px;background:#cce9f3;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);transition:width .25s}.equation{display:flex;width:100%;padding:0 clamp(12px,2vw,28px);align-items:center;justify-content:center;gap:clamp(7px,1.1vw,14px);font-size:clamp(2.45rem,5.2vw,4.8rem);font-weight:900;line-height:1;white-space:nowrap}.box{display:grid;width:1.6em;height:1.18em;flex:0 0 1.6em;place-items:center;border:5px solid var(--coral);border-radius:.24em;background:#fff;font-size:.9em}.box.filled{background:#fff2ae}.feedback{min-height:1.5em;margin:18px 0 7px;color:#517084;font-weight:900}.feedback.good{color:#219554;font-size:1.3rem}.feedback.bad{color:#d84444;font-size:1.3rem}.problem.good{animation:pulse .38s}.problem.bad{animation:shake .3s}.start{min-width:180px;min-height:50px;padding:7px 22px;border:0;border-radius:16px;background:var(--coral);color:#fff;font-size:1.15rem;font-weight:900;box-shadow:0 6px 0 #c94444}.numbers>p{margin:0 0 7px;font-size:.9rem;font-weight:900}.grid{display:grid;width:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,.9vw,10px)}.grid button{min-height:clamp(48px,8.2vh,68px);border:3px solid #fff;border-radius:15px;color:#22324b;font-size:clamp(1.35rem,3vw,2.3rem);font-weight:900;box-shadow:0 5px 0 #534b2033}.grid button:disabled{opacity:.45}.result{display:flex;flex-direction:column;align-items:center}.result p{margin:0;color:#278f58;font-size:1.4rem;font-weight:900}.result strong{margin:7px 0;color:var(--coral);font-size:clamp(3.3rem,7vw,5.8rem);line-height:1}.result span{margin-bottom:8px;font-weight:800}.best{margin-bottom:12px;color:#d46b00}.hidden{display:none!important}.overlay{position:fixed;z-index:20;inset:0;display:none;padding:18px;place-items:center;background:#18243794;backdrop-filter:blur(4px)}.overlay.open{display:grid}.modal{position:relative;width:min(720px,96vw);max-height:88dvh;padding:22px;border:4px solid #fff;border-radius:23px;background:#fffdf8;overflow:auto}.close{position:absolute;top:10px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:#edf0f2;font-size:1.4rem;font-weight:900}.note{padding:8px 11px;border-radius:10px;background:#fff1c9;color:#6b5a2d;font-size:.82rem;font-weight:700}.players{display:flex;margin:12px 0;flex-wrap:wrap;gap:7px}.players button{padding:7px 14px;border:2px solid #93a6b1;border-radius:999px;background:#fff;font-weight:800}.players button.selected{border-color:#208ab8;background:#dff5ff;box-shadow:0 0 0 3px #bde9fb}.form{display:grid;padding:13px;grid-template-columns:1fr auto;gap:9px;align-items:end;border-radius:14px;background:#eef7f8}.form label{display:flex;flex-direction:column;font-size:.76rem;font-weight:800}.form input{min-height:44px;padding:6px 11px;border:2px solid #97aab4;border-radius:9px}.form button{min-height:44px;padding:6px 17px;border:0;border-radius:10px;background:#208ab8;color:#fff;font-weight:900}.recordTarget{display:inline-block;padding:5px 12px;border-radius:999px;background:#fff1c9;font-weight:900}.summary{display:flex;padding:9px;justify-content:space-around;border-radius:11px;background:#edf7f9;font-weight:800}.records{padding:0;list-style:none}.records li{display:grid;padding:8px 10px;grid-template-columns:1fr auto auto;gap:18px;border-bottom:1px dashed #c9d4d8}.records b{color:#1676a0}.empty{padding:34px;text-align:center;color:#70818e;font-weight:800}.celebrate{position:fixed;z-index:40;inset:0;display:none;place-items:center;background:#fffad8e8;overflow:hidden}.celebrate.open{display:grid}.message{position:relative;z-index:2;padding:26px 50px;border:6px solid #fff;border-radius:32px;background:linear-gradient(145deg,#ffdd55,#ff9b5d);text-align:center;box-shadow:0 16px 0 #e86f45;animation:pop .55s}.message em{font-style:normal;font-size:3.5rem}.message h2{margin:0;color:#fff;font-size:clamp(2.7rem,7vw,5rem);text-shadow:0 5px 0 #d85b3f}.message h3{margin:0;color:#7f2d16;font-size:clamp(1.8rem,4vw,3rem)}.message p{font-weight:900}.confetti{position:absolute;top:-8%;width:12px;height:23px;border-radius:4px;animation:fall 2.7s var(--d) linear infinite}@keyframes pulse{50%{box-shadow:inset 0 0 0 8px #b9efc9}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes pop{from{transform:scale(.2);opacity:0}}@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
@media(min-width:700px) and (max-height:850px){.app{padding:4px}.card{min-height:calc(100dvh - 8px);padding:6px 11px 9px}.badge{width:40px;height:40px;font-size:1.45rem}.brand small{font-size:.6rem}.brand h1{font-size:1.4rem}.util,.sound{min-height:34px}.util{padding:3px 10px;font-size:.76rem}.status{min-height:32px;margin:4px 0;font-size:.68rem}.target select{min-width:57px;font-size:.9rem}.play{min-height:calc(100dvh - 94px);gap:9px}.problem{padding:11px 16px}.numbers{padding:9px}.round{top:8px}.progress{top:41px;height:6px}.grid{gap:6px}.grid button{min-height:clamp(42px,7.4vh,58px);border-radius:12px}.feedback{margin:10px 0 4px}.start{min-height:42px}}
@media(max-width:699px){.play{grid-template-columns:1fr;min-height:auto}.problem{min-height:330px}.numbers{min-height:420px}.status{flex-wrap:wrap}.brand small{display:none}.form{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="card"><header class="top"><div class="brand"><span class="badge">＋</span><div><small>ほすう タイムゲーム</small><h1>ぴったり つくろう！</h1></div></div><div class="actions"><button id="nameBtn" class="util">👤 名前</button><button id="recordBtn" class="util" disabled>📈 きろく</button><button id="soundBtn" class="sound">🔊</button></div></header><div class="status"><b id="playerStatus">「名前」から とうろくしよう</b><label class="target">合計を <select id="targetSelect"></select> にする</label><span id="bestStatus">ベスト：―</span></div><div class="play"><section id="problem" class="problem"><div class="round"><span id="count" class="count">10もん</span><span id="timer" class="timer">⏱ 0.00秒</span></div><div class="progress"><i id="progress" style="width:0"></i></div><div id="game"><div class="equation"><span id="left">2</span><span>＋</span><span id="box" class="box"></span><span>＝</span><span id="total">10</span></div><p id="feedback" class="feedback">合計をえらんで スタート</p><div style="text-align:center"><button id="start" class="start">スタート</button></div></div><div id="result" class="result hidden"><p id="resultTitle">10もん クリア！</p><strong id="finalTime">0.00秒</strong><span id="finalMistakes">まちがい：0回</span><b id="bestLabel" class="best hidden">✨ まえより はやい！ ✨</b><button id="retry" class="start">もう一度</button></div></section><section class="numbers"><p>わくに はいる 数は？</p><div id="grid" class="grid"></div></section></div></section></main>
<div id="nameOverlay" class="overlay"><section class="modal"><button class="close" data-close="nameOverlay">×</button><h2>名前</h2><p class="note">この端末の中だけに保存します。本名ではなく、ニックネームがおすすめです。</p><div id="players" class="players"></div><div class="form"><label>あたらしい名前<input id="newName" maxlength="12" placeholder="ニックネーム"></label><button id="addPlayer">とうろく</button></div></section></div><div id="recordOverlay" class="overlay"><section class="modal"><button class="close" data-close="recordOverlay">×</button><h2 id="recordTitle">きろく</h2><p id="recordTarget" class="recordTarget"></p><div id="summary" class="summary"></div><ol id="records" class="records"></ol><p id="empty" class="empty">まだ記録がありません。</p></section></div><div id="celebrate" class="celebrate"><div class="message"><em>🎉</em><h2>すごい！</h2><h3>ベストきろく！</h3><p>まえより はやく できたね！</p></div></div>
<script>"use strict";
const STORE="make-total-time-game-players-v1",SEL="make-total-time-game-selected-v1",COLORS=["#f6b9bd","#f6d59b","#f4e99b","#b9df9f","#96d8c7","#91d4ea","#9dbce7","#b8a8e6","#dfb1d7","#f6b9bd"];let players=[],selectedId="",target=10,screen="ready",questions=[],index=0,elapsed=0,mistakes=0,entered=null,locked=false,soundOn=true,startAt=0,timerId=null,audio=null,praise="";const $=id=>document.getElementById(id),selected=()=>players.find(p=>p.id===selectedId)||null,fmt=n=>`${Number(n).toFixed(2)}秒`,recs=()=>selected()?.records.filter(r=>r.target===target)||[],best=()=>recs().length?Math.min(...recs().map(r=>r.time)):null;
function ctx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();return audio}function tone(f,s,d,type="sine",v=.13){if(!soundOn)return;const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.02)}function pip(){const c=ctx();if(c)tone(880,c.currentTime,.09)}function correct(){const c=ctx();if(c){tone(659,c.currentTime,.18);tone(784,c.currentTime+.14,.28)}}function wrong(){const c=ctx();if(c){tone(145,c.currentTime,.25,"sawtooth",.08);tone(112,c.currentTime+.06,.28,"square",.04)}}function fanfare(){const c=ctx();if(c)[523,659,784,1047].forEach((f,i)=>tone(f,c.currentTime+i*.13,i===3?.55:.22,"triangle"))}
function save(){localStorage.setItem(STORE,JSON.stringify(players));localStorage.setItem(SEL,selectedId)}function load(){try{players=JSON.parse(localStorage.getItem(STORE)||"[]");selectedId=localStorage.getItem(SEL)||players[0]?.id||""}catch{}for(let n=10;n<=20;n++){const o=document.createElement("option");o.value=n;o.textContent=n;$("targetSelect").appendChild(o)}renderAll()}function shuffle(){const a=Array.from({length:target},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,10)}
function start(){if(!selected()){open("nameOverlay");return}questions=shuffle();index=0;elapsed=0;mistakes=0;entered=null;locked=false;praise="";screen="playing";startAt=performance.now();clearInterval(timerId);timerId=setInterval(()=>{elapsed=(performance.now()-startAt)/1000;renderGame()},50);pip();renderAll()}function answer(n){if(screen!=="playing"||locked)return;entered=n;renderGame();if(n!==target-questions[index]){mistakes++;wrong();flash("bad","もう一度！");return}locked=true;correct();flash("good","せいかい！");const last=index===9;setTimeout(()=>{if(last)finish();else{index++;entered=null;locked=false;$("problem").className="problem";$("feedback").className="feedback";pip();renderGame()}},430)}function flash(k,t){$("problem").className=`problem ${k}`;$("feedback").className=`feedback ${k}`;$("feedback").textContent=t;if(k==="bad")setTimeout(()=>{$("problem").className="problem";$("feedback").className="feedback";$("feedback").textContent="こたえを タッチ"},350)}
function finish(){elapsed=(performance.now()-startAt)/1000;clearInterval(timerId);const prior=best(),p=selected();p.records.push({target,time:elapsed,mistakes,date:new Date().toISOString()});praise=prior===null?"first":elapsed<prior?"best":"";screen="finished";save();renderAll();if(praise==="best"){fanfare();celebrate()}}function celebrate(){const area=$("celebrate");area.classList.add("open");if(!area.querySelector(".confetti"))for(let i=0;i<48;i++){const c=document.createElement("i");c.className="confetti";c.style.left=`${i*37%100}%`;c.style.background=COLORS[i%10];c.style.setProperty("--d",`${i%9*.08}s`);area.appendChild(c)}setTimeout(()=>area.classList.remove("open"),4200)}
function renderNumbers(){const grid=$("grid");grid.innerHTML="";for(let n=1;n<=target;n++){const b=document.createElement("button");b.textContent=n;b.style.background=COLORS[(n-1)%10];b.disabled=screen!=="playing"||locked;b.onclick=()=>answer(n);grid.appendChild(b)}}function renderGame(){$("timer").textContent=`⏱ ${fmt(elapsed)}`;$("count").textContent=screen==="playing"?`${index+1} / 10`:"10もん";$("progress").style.width=screen==="playing"?`${index*10}%`:screen==="finished"?"100%":"0%";$("left").textContent=screen==="playing"?questions[index]:Math.max(0,target-8);$("box").textContent=entered??"";$("box").className=entered===null?"box":"box filled";$("total").textContent=target;$("game").classList.toggle("hidden",screen==="finished");$("result").classList.toggle("hidden",screen!=="finished");$("targetSelect").disabled=screen==="playing";if(screen==="ready"){$("feedback").textContent="合計をえらんで スタート";$("start").classList.remove("hidden")}else if(screen==="playing"&&!locked){$("feedback").textContent="こたえを タッチ";$("start").classList.add("hidden")}if(screen==="finished"){$("resultTitle").textContent=praise==="first"?"はじめての きろく！":"10もん クリア！";$("finalTime").textContent=fmt(elapsed);$("finalMistakes").textContent=`まちがい：${mistakes}回`;$("bestLabel").classList.toggle("hidden",praise!=="best")}}
function renderHeader(){const p=selected();$("playerStatus").textContent=p?`なまえ：${p.name}`:"「名前」から とうろくしよう";$("bestStatus").textContent=`ベスト：${best()===null?"―":fmt(best())}`;$("recordBtn").disabled=!p}function renderPlayers(){const area=$("players");area.innerHTML="";players.forEach(p=>{const b=document.createElement("button");b.textContent=p.name;b.className=p.id===selectedId?"selected":"";b.onclick=()=>{selectedId=p.id;save();close("nameOverlay");renderAll()};area.appendChild(b)})}function renderRecords(){const p=selected();if(!p)return;const rs=recs();$("recordTitle").textContent=`${p.name}さんの きろく`;$("recordTarget").textContent=`合計 ${target} のきろく`;$("summary").innerHTML=`<span>ちょうせん：${rs.length}回</span><span>ベスト：${best()===null?"―":fmt(best())}</span>`;$("empty").classList.toggle("hidden",rs.length>0);$("records").innerHTML=rs.slice(-10).reverse().map(r=>`<li><span>${new Date(r.date).toLocaleDateString("ja-JP")}</span><b>${fmt(r.time)}</b><small>まちがい ${r.mistakes}回</small></li>`).join("")}function renderAll(){renderHeader();renderPlayers();renderGame();renderNumbers();renderRecords()}function open(id){$(id).classList.add("open");if(id==="recordOverlay")renderRecords()}function close(id){$(id).classList.remove("open")}
$("targetSelect").onchange=e=>{target=Number(e.target.value);screen="ready";elapsed=0;entered=null;praise="";renderAll()};$("start").onclick=start;$("retry").onclick=start;$("nameBtn").onclick=()=>open("nameOverlay");$("recordBtn").onclick=()=>open("recordOverlay");$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊":"🔇"};$("addPlayer").onclick=()=>{const name=$("newName").value.trim().slice(0,12);if(!name)return;const p={id:`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,name,records:[]};players.push(p);selectedId=p.id;$("newName").value="";save();close("nameOverlay");renderAll()};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll(".overlay").forEach(o=>o.onmousedown=e=>{if(e.target===o)close(o.id)});$("celebrate").onclick=()=>$("celebrate").classList.remove("open");load();
</script></body></html>
